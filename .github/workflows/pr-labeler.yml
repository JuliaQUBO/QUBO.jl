name: Label Pull Requests

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    uses: JuliaQUBO/.github/.github/workflows/pr-labeler.yml@02781d5b27dd8f0d2bc5b1fe3845eff7113244ec
    with:
      configuration_path: .github/labeler.yml
