name: Dependabot Auto-merge

on:
  workflow_run:
    workflows: [CI, Documentation, Ecosystem Canary, Doc Preview Cleanup]
    types: [completed]
  schedule:
    - cron: '47 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

# Every invocation reconciles all eligible PRs, so pending runs can coalesce.
concurrency:
  group: dependabot-automerge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.repository == 'JuliaQUBO/QUBO.jl' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.actor.login == 'dependabot[bot]' ||
         startsWith(github.event.workflow_run.head_branch, 'dependabot/') ||
         github.event.workflow_run.head_branch == 'main')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Merge green Dependabot PRs and reconcile publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/dependabot_automerge.py
