name: Dependabot Auto-merge

on:
  workflow_run:
    workflows: [CI, Documentation, Ecosystem Canary, Doc Preview Cleanup]
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

# Every invocation reconciles all eligible PRs, so pending runs can coalesce.
concurrency:
  group: dependabot-automerge
  cancel-in-progress: false

jobs:
  merge:
    if: github.repository == 'JuliaQUBO/QUBO.jl'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Merge green Dependabot PRs and reconcile publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/dependabot_automerge.py
